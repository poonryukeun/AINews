timezone: Asia/Shanghai
site_title: "AI 资讯博客"

# 信息源（支持 RSS/Atom + HTML 抓取两种模式）
feeds:
  # ---- RSS/Atom 源 ----
  - name: "OpenAI News"
    url: "https://openai.com/news/rss.xml"
    mode: rss
    default_topics: ["大模型", "产品与应用"]

  - name: "NVIDIA Newsroom"
    url: "https://nvidianews.nvidia.com/rss"
    mode: rss
    default_topics: ["芯片与算力"]

  - name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
    mode: rss
    default_topics: ["开源生态", "数据与评测"]

  # ---- HTML 抓取源（直接解析页面，更稳定） ----
  - name: "Anthropic News"
    url: "https://www.anthropic.com/news"
    mode: html
    selectors:
      list: "a[href*='/news/']"
      title: "text"
      link: "href"
    default_topics: ["大模型", "产品与应用"]

  - name: "Google DeepMind Blog"
    url: "https://deepmind.google/blog/"
    mode: html
    selectors:
      list: "a[href*='/blog/']"
      title: "text"
      link: "href"
    default_topics: ["大模型", "智能体Agent"]

topic_rules:
  - topic: "多模态"
    keywords: ["image", "vision", "video", "multimodal", "omni", "图片", "视觉", "视频", "多模态", "sora"]
  - topic: "智能体Agent"
    keywords: ["agent", "agents", "agentic", "workflow", "tool", "mcp", "智能体", "代理", "工具"]
  - topic: "安全与对齐"
    keywords: ["security", "safety", "privacy", "alignment", "secure", "安全", "隐私", "对齐", "redact"]
  - topic: "训练与推理优化"
    keywords: ["inference", "latency", "throughput", "quant", "kv cache", "推理", "延迟", "吞吐", "量化"]
